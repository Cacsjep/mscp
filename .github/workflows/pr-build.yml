name: PR Build

# Gate every pull request on a clean build of the plugins it touches.
#
# A change confined to one plugin builds that plugin only - the other 25 are not
# compiled and the installer is skipped. Anything shared (CommunitySDK, the
# Directory.Build files, plugins.json, installer/, .github/workflows/) falls back
# to the full matrix plus the installer, and build-release.yml always builds
# everything, so nothing ships unvalidated.
#
# Artifacts are uploaded for inspection but expire after 1 day.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Docs-only PRs (docs/**, *.md, mkdocs.yml) skip the heavy Windows build
# matrix. The build/installer jobs are gated on the "changes" filter, while
# ci-success always runs and reports green, so the required
# "PR Build / ci-success" check is satisfied without compiling anything.

# A newer push to the same PR cancels the in-flight run.
concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether any non-docs file changed. Docs-only PRs skip the build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # 'every' = a file is a code change only if it matches ALL patterns,
          # i.e. it is not under docs/, not a *.md, and not mkdocs.yml. With the
          # default 'some' quantifier the leading '**' would match every file
          # (including docs) and the negations would be ignored.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!mkdocs.yml'

  # Generate the build matrix from plugins.json, restricted to the plugins this
  # PR actually touches.
  #
  # The selection is derived from plugins.json rather than a hand-written list of
  # path filters, so it covers every plugin automatically - including one added
  # later by someone who never edits this file. A duplicated list would silently
  # skip an unregistered plugin, which is the one failure mode worth designing out.
  setup:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      names: ${{ steps.gen.outputs.names }}
      count: ${{ steps.gen.outputs.count }}
      full: ${{ steps.gen.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Needed so the base commit is present for the diff below.
          fetch-depth: 0

      - id: gen
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $plugins = Get-Content plugins.json -Raw | ConvertFrom-Json
          $include = @()
          $names = @()

          $changed = @(git diff --name-only "$env:BASE_SHA" HEAD)
          Write-Host "Changed files ($($changed.Count)):"
          $changed | ForEach-Object { Write-Host "  $_" }

          # Anything shared forces the whole matrix. CommunitySDK is referenced by
          # 24 of the 26 plugins, and the Directory.Build files feed every project,
          # so a targeted build off those would compile plugins against a stale SDK.
          # installer/ and plugins.json are here because the MSI enumerates every
          # plugin, and .github/workflows/ so a change to CI itself is proven against
          # the full set.
          $sharedPatterns = @(
            '^CommunitySDK/',
            '^Directory\.Build\.(props|targets)$',
            '^plugins\.json$',
            '^installer/',
            '^\.github/workflows/'
          )

          $full = $false
          $trigger = $null
          foreach ($f in $changed) {
            foreach ($pat in $sharedPatterns) {
              if ($f -match $pat) { $full = $true; $trigger = $f; break }
            }
            if ($full) { break }
          }

          if ($full) {
            Write-Host "`nShared path changed ($trigger) - building every plugin."
          }

          # True when $file is inside $owned, or is $owned itself. Compared with
          # forward slashes throughout: git reports them that way and plugins.json
          # stores them that way. The trailing slash matters - without it
          # "Smart Client Plugins/Notepad" would also claim "...NotepadExtra".
          #
          # Case-insensitive deliberately. plugins.json is hand-maintained and its
          # casing already drifts from git's - PKI's extraStagingFiles says
          # "Installer/..." where the tree has "installer/". An exact comparison
          # would quietly drop that plugin from the matrix, which is precisely the
          # silent-skip failure this selection is meant to avoid.
          function Test-Owned([string]$file, [string]$owned) {
            $owned = $owned -replace '\\', '/'
            return $file -eq $owned -or
                   $file.StartsWith("$owned/", [StringComparison]::OrdinalIgnoreCase)
          }

          foreach ($p in $plugins) {
            $project = if ($p.project) { $p.project } else { "$($p.name).csproj" }
            $platform = if ($p.platform) { $p.platform } else { 'AnyCPU' }
            $outputPath = if ($p.outputPath) { $p.outputPath }
                          elseif ($platform -eq 'x64') { 'bin/x64/Release/net48' }
                          else { 'bin/Release/net48' }

            $projects = @("$($p.path)/$project" -replace '/', '\')
            if ($p.extraProjects) {
              foreach ($ep in $p.extraProjects) {
                $projects += ($ep -replace '/', '\')
              }
            }

            # Everything this plugin owns: its own folder, plus any project or
            # staging path outside it. extraProjects points at a .csproj, so its
            # containing folder is what counts as touched.
            $owned = @($p.path)
            if ($p.extraProjects)     { $owned += $p.extraProjects | ForEach-Object { ($_ -replace '\\', '/') -replace '/[^/]+$', '' } }
            if ($p.extraStagingDirs)  { $owned += $p.extraStagingDirs }
            if ($p.extraStagingFiles) { $owned += $p.extraStagingFiles }
            $owned = $owned | Where-Object { $_ } | Select-Object -Unique

            if (-not $full) {
              $hit = $false
              foreach ($f in $changed) {
                foreach ($o in $owned) {
                  if (Test-Owned $f $o) { $hit = $true; break }
                }
                if ($hit) { break }
              }
              if (-not $hit) { continue }
              Write-Host "selected $($p.name)"
            }

            $include += @{
              name       = $p.name
              projects   = $projects -join ';'
              platform   = $platform
              stage_from = ("$($p.path)/$outputPath" -replace '/', '\')
              stage_to   = $p.name
            }
            $names += $p.name
          }

          $matrix = @{ include = $include } | ConvertTo-Json -Depth 5 -Compress
          # -InputObject, not the pipeline: piping enumerates, so a single selected
          # plugin would serialise as "FlexView" instead of ["FlexView"]. That never
          # arose while the matrix was always all 26, and nothing in this workflow
          # reads names today, but a consumer added later would break on exactly the
          # one-plugin PR this change makes the common case.
          $namesList = ConvertTo-Json -InputObject @($names) -Compress

          Write-Host "`nBuilding $($include.Count) of $($plugins.Count) plugin(s)."

          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "names=$namesList" >> $env:GITHUB_OUTPUT
          "count=$($include.Count)" >> $env:GITHUB_OUTPUT
          "full=$($full.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  # Matrix build: each selected plugin compiles in parallel.
  # Guarded on count so an empty selection skips the job instead of failing on an
  # empty matrix (a code change that touches no plugin, e.g. Tools/ or Tests/).
  build:
    needs: [changes, setup]
    if: needs.changes.outputs.code == 'true' && needs.setup.outputs.count != '0'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0

      - name: Restore NuGet packages
        run: nuget restore MSCPlugins.sln

      - name: Build ${{ matrix.name }}
        run: |
          $projects = "${{ matrix.projects }}" -split ";"
          foreach ($proj in $projects) {
            msbuild $proj /p:Configuration=Release /p:Platform="${{ matrix.platform }}" /p:CIBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh

      - name: Publish PKI Cert Installer (PKI matrix entry only)
        if: matrix.name == 'PKI'
        shell: pwsh
        run: |
          dotnet publish Installer\Mscp.PkiCertInstaller\Mscp.PkiCertInstaller.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:CIBuild=true /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage ${{ matrix.name }}
        run: |
          New-Item -ItemType Directory -Path staging\${{ matrix.stage_to }} -Force
          Copy-Item -Path "${{ matrix.stage_from }}\*" -Destination staging\${{ matrix.stage_to }} -Recurse
        shell: pwsh

      - name: Extra staging for ${{ matrix.name }}
        shell: pwsh
        run: |
          $plugins = Get-Content plugins.json -Raw | ConvertFrom-Json
          $p = $plugins | Where-Object { $_.name -eq '${{ matrix.name }}' }
          if ($p.extraStagingDirs) {
            foreach ($dir in $p.extraStagingDirs) {
              $src = $dir -replace '/', '\'
              Copy-Item -Path "$src\*" -Destination "staging\${{ matrix.stage_to }}" -Recurse -Force
              Write-Host "Extra staging dir: $src"
            }
          }
          if ($p.extraStagingFiles) {
            foreach ($file in $p.extraStagingFiles) {
              $src = $file -replace '/', '\'
              Copy-Item -Path $src -Destination "staging\${{ matrix.stage_to }}" -Force
              Write-Host "Extra staging file: $src"
            }
          }

      - name: Create ZIP
        run: Compress-Archive -Path staging\${{ matrix.stage_to }} -DestinationPath ${{ matrix.name }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          retention-days: 1

  # Build the unified installer (no release) to validate packaging.
  #
  # Only on a full build. generate-wix.ps1 emits one component per plugin from
  # plugins.json and wix resolves !(bindpath.zips)\<Name>-v<version>.zip at compile
  # time, so a partial run is missing ZIPs and cannot link. Packaging is still
  # proven whenever installer/, plugins.json or shared code changes, and
  # unconditionally by build-release.yml.
  installer:
    needs: [changes, setup, build]
    if: needs.changes.outputs.code == 'true' && needs.setup.outputs.full == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5 -g
          wix extension add WixToolset.Util.wixext/5 -g
          wix extension add WixToolset.Iis.wixext/5.0.2 -g

      - name: Generate WiX components
        shell: pwsh
        run: |
          pwsh installer/generate-wix.ps1

      - name: Build installer custom actions
        shell: pwsh
        run: |
          msbuild installer\customactions\InstallerCustomActions.csproj `
            /restore `
            /p:Configuration=Release `
            /t:Rebuild `
            /v:minimal

      - name: Stage IIS hosting payload
        shell: pwsh
        run: |
          $version = "0.0.${{ github.run_number }}"
          $publicStaged = Join-Path (Get-Location) 'public-staged'
          pwsh installer/stage-iis-hosting.ps1 `
            -ManifestPath plugins.json `
            -PublicSrc installer/public `
            -PublicStaged $publicStaged `
            -Version $version

      - name: Collect per-plugin ZIPs for WiX bindpath
        shell: pwsh
        run: |
          $version = "0.0.${{ github.run_number }}"
          $zipsRoot = Join-Path (Get-Location) 'zips-flat'
          if (Test-Path $zipsRoot) { Remove-Item $zipsRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $zipsRoot -Force | Out-Null
          Get-ChildItem 'artifacts' -Directory | ForEach-Object {
            $name = $_.Name
            $src = Join-Path $_.FullName "$name.zip"
            if (Test-Path $src) {
              Copy-Item $src -Destination (Join-Path $zipsRoot "$name-v$version.zip") -Force
            }
          }

      - name: Stage PKI Cert Installer EXE (versioned) for WiX
        shell: pwsh
        run: |
          $version = "0.0.${{ github.run_number }}"
          $zipsRoot = Join-Path (Get-Location) 'zips-flat'
          $pkiZip = Join-Path (Get-Location) 'artifacts\PKI\PKI.zip'
          if (-not (Test-Path $pkiZip)) { throw "PKI artifact not found at $pkiZip" }
          $tmp = Join-Path $env:RUNNER_TEMP 'pki-extract'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Expand-Archive -Path $pkiZip -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Filter 'Mscp.PkiCertInstaller.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Mscp.PkiCertInstaller.exe not found inside PKI.zip" }
          Copy-Item $exe.FullName -Destination (Join-Path $zipsRoot "Mscp.PkiCertInstaller-v$version.exe") -Force
          Write-Host "Staged Mscp.PkiCertInstaller-v$version.exe ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "0.0.${{ github.run_number }}"
          $publicStaged = Join-Path (Get-Location) 'public-staged'
          $zipsRoot = Join-Path (Get-Location) 'zips-flat'
          wix build installer/wix/Product.wxs installer/wix/Components.wxs installer/wix/IisHosting.wxs `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -ext WixToolset.Iis.wixext `
            -d Version=$version `
            -arch x64 `
            -b installer/wix `
            -bindpath "publicroot=$publicStaged" `
            -bindpath "zips=$zipsRoot" `
            -pdbtype none `
            -o "MSCPlugins-pr-Setup.msi"

      - name: Upload MSI installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MSI-Installer
          path: MSCPlugins-pr-Setup.msi
          retention-days: 1

  # Single, stable status check to require in branch protection. Require
  # "PR Build / ci-success" in the ruleset instead of the churning per-plugin
  # matrix job names - which is also what makes a selective matrix possible at
  # all, since the set of matrix job names now varies per PR.
  #
  # Three legitimate ways to pass without compiling: a docs-only change, a code
  # change that touches no plugin, and a partial build where the installer was
  # deliberately skipped. Each is checked explicitly rather than by treating
  # "skipped" as success, so a job that skips for some other reason still fails.
  ci-success:
    if: always()
    needs: [changes, setup, build, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all build jobs succeeded
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change, build skipped."
            exit 0
          fi

          if [ "${{ needs.setup.result }}" != "success" ]; then
            echo "Matrix generation failed: setup=${{ needs.setup.result }}"
            exit 1
          fi

          if [ "${{ needs.setup.outputs.count }}" = "0" ]; then
            echo "No plugin sources changed, nothing to build."
            exit 0
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed: build=${{ needs.build.result }}"
            exit 1
          fi

          # The installer only runs on a full build; on a partial one its result
          # is "skipped" and that is the expected outcome, not a failure.
          if [ "${{ needs.setup.outputs.full }}" = "true" ]; then
            if [ "${{ needs.installer.result }}" != "success" ]; then
              echo "Installer failed: installer=${{ needs.installer.result }}"
              exit 1
            fi
            echo "Full build: all ${{ needs.setup.outputs.count }} plugin(s) and the installer succeeded."
          else
            echo "Partial build: ${{ needs.setup.outputs.count }} plugin(s) succeeded; installer skipped (no shared or installer change)."
          fi
