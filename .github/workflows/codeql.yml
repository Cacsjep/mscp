name: CodeQL

# Static analysis (SAST) on every push to main and every pull request, plus a
# weekly sweep so new CodeQL queries reach existing code without a new commit.
# OpenSSF Scorecard's SAST check reads these runs; without them the repo scores
# a warning for "SAST tool is not run on all commits".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:17 UTC, offset off the hour to avoid the scheduler rush.
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A newer push to the same PR cancels the in-flight analysis.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # C# targets net48, so it needs MSBuild on Windows and an explicit
          # build - autobuild cannot infer the plugin/driver layout.
          - language: csharp
            runner: windows-latest
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
          # Analyzes the workflow files themselves (untrusted checkout, script
          # injection via ${{ }} interpolation, over-broad permissions).
          - language: actions
            runner: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Setup MSBuild
        if: matrix.language == 'csharp'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        if: matrix.language == 'csharp'
        uses: NuGet/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0

      - name: Build solution
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          nuget restore MSCPlugins.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Solution-level build so the sln's per-project platform mapping
          # applies (some projects are x64-only). CIBuild=true skips the
          # dev-deploy targets that stop services and copy into MIPPlugins.
          msbuild MSCPlugins.sln /p:Configuration=Release /p:CIBuild=true /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: "/language:${{ matrix.language }}"
